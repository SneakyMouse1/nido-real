services:
  nidoapp:
    build:
      context: .
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    image: nido-real-app
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    volumes:
      - app-data:/var/www
      - /var/www/nido-real-storage:/var/www/storage/app/public
    networks:
      - dokploy-network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - nidoapp
    volumes:
      - app-data:/var/www
      - /var/www/nido-real-storage:/var/www/storage/app/public
    networks:
      - dokploy-network

  scheduler:
    image: nido-real-app
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    depends_on:
      - nidoapp
    volumes:
      - app-data:/var/www
      - /var/www/nido-real-storage:/var/www/storage/app/public
    networks:
      - dokploy-network
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 30 && while true; do php artisan schedule:run --no-interaction >> /dev/null 2>&1; sleep 60; done"]

networks:
  dokploy-network:
    external: true

volumes:
  app-data:
